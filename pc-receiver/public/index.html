<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhoneCam Receiver</title><style>body{margin:0;background:#080b10;color:#eaf2f8;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(1100px,94vw)}video{width:100%;background:#000;border-radius:14px;display:block}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pill{padding:6px 10px;border-radius:99px;background:#18212b}.ok{color:#63e6be}.bad{color:#ff8787}</style></head><body><main><header><strong>PhoneCam Receiver</strong><span id="status" class="pill">Connecting…</span></header><video id="video" autoplay playsinline controls></video></main><script>
const status=document.querySelector('#status'), video=document.querySelector('#video');
const ws=new WebSocket(`ws://${location.host}`); const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
pc.ontrack=e=>{video.srcObject=e.streams[0]; status.textContent='LIVE'; status.className='pill ok'};
pc.onicecandidate=e=>{if(e.candidate) ws.send(JSON.stringify({type:'candidate',candidate:e.candidate.candidate,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex}))};
pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='disconnected'){status.textContent=pc.connectionState;status.className='pill bad'}};
ws.onopen=()=>{ws.send(JSON.stringify({role:'viewer'})); status.textContent='Waiting for phone…'};
ws.onmessage=async e=>{const m=JSON.parse(e.data); if(m.type==='offer'){await pc.setRemoteDescription({type:'offer',sdp:m.sdp}); const a=await pc.createAnswer(); await pc.setLocalDescription(a); ws.send(JSON.stringify({type:'answer',sdp:a.sdp}))} else if(m.type==='candidate'){try{await pc.addIceCandidate(m)}catch{}}};
</script></body></html>
