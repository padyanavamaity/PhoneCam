# Project-wide Gradle settings.
# See https://developer.android.com/topic/libraries/support-library/androidx

# Enables AndroidX for this project (required by androidx.* dependencies).
android.useAndroidX=true

# Enables Jetifier to migrate third-party libraries to AndroidX.
android.enableJetifier=true

# JVM arguments for the Gradle Daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle build cache for faster incremental builds.
org.gradle.caching=true

# Enable parallel project execution.
org.gradle.parallel=true
